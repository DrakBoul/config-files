# ~/.tmux.conf

# Use C-a as the leader (prefix) instead of C-b
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Windows and panes start numbering from 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Faster escape time (nicer for vim)
set -sg escape-time 0

# Reload config with prefix + r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

# Split panes using | and -, keep current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Enable vi mode for copy mode
setw -g mode-keys vi

# Vim-style copy/paste bindings
bind Escape copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel
bind p paste-buffer

# Move the status bar to the top of the screen
set -g status-position top

bind-key -r f run-shell "tmux neww ~/Scripts/tmux-sessionizer"
